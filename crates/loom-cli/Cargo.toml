[package]
name = "loom-cli"
description = "Loom command-line tools: `loom` (client) and `loomd` (warp log, witness, thread rebuilder, shuttle peer)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "loom"
path = "src/bin/loom.rs"

[[bin]]
name = "loomd"
path = "src/bin/loomd.rs"

[dependencies]
loom-core.workspace = true
loom-warp.workspace = true
loom-heddle.workspace = true
loom-shuttle.workspace = true
loom-weave.workspace = true
loom-aur.workspace = true
loom-thread.workspace = true
loom-client.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
clap.workspace = true
